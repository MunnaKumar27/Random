<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Split Image Grid</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f9f9f9;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        
        .image-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            aspect-ratio: 3 / 4;
            width: 90vw;
            max-width: 600px;
            gap: 2px;
            /* Very little gap */
            overflow: hidden;
            border-radius: 12px;
        }
        
        .tile {
            background-image: url('/image/IMG-20240204-WA0119.jpg');
            background-size: 300% 300%;
            background-repeat: no-repeat;
            transition: transform 0.3s ease;
        }
        
        .tile:hover {
            transform: scale(1.03);
            z-index: 1;
        }
        
        @media (max-width: 600px) {
            .image-grid {
                grid-template-columns: repeat(2, 1fr);
                aspect-ratio: 2 / 3;
            }
        }
    </style>
</head>

<body>
    <h1>✨I Love You </h1>
    <div class="image-grid" id="grid"></div>

    <script>
        const grid = document.getElementById('grid');
        const rows = 3;
        const cols = 3;

        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                const tile = document.createElement('div');
                tile.className = 'tile';
                tile.style.backgroundPosition = `${(c / (cols - 1)) * 100}% ${(r / (rows - 1)) * 100}%`;
                grid.appendChild(tile);
            }
        }
    </script>
</body>

</html>
